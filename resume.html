<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Resume - Karan Ahire</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    iframe {
      width: 90%;
      height: 600px;
      border: none;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 10px 20px;
      background: #38bdf8;
      color: black;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .top-img {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .top-img img {
      width: 120px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="top-img">
    <img src="resume.jpg" alt="Profile Image">
  </div>

  <h1>My Resume</h1>

  <iframe src="resume.pdf"></iframe>

  <br>

  <a class="btn" href="resume.pdf" download>Download Resume</a>

</body>

</html>
