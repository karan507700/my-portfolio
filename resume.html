<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>My Resume</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 40px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      background: #38bdf8;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      background: #0ea5e9;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 80%;
      margin: auto;
    }
  </style>
</head>

<body>

  <h1>📄 My Resume</h1>

  <div class="card">

    <p>Click below to view or download resume</p>

    <a class="btn" href="resume.pdf" target="_blank">Open Resume</a>

    <a class="btn" href="resume.pdf" download>Download Resume</a>

    <a class="btn" href="index.html">Back to Home</a>

  </div>

</body>

</html>
